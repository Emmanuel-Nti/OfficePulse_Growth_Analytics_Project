version: 2

models:
  - name: stg_paid_ads
    description: >
      Cleaned paid advertising data with standardized column names and data
      types. Each row represents campaign activity for one campaign on a
      specific date.

    columns:
      - name: campaign_date
        description: "Date of the paid advertising activity."
        tests:
          - not_null

      - name: campaign_id
        description: "Identifier of the paid advertising campaign."
        tests:
          - not_null

      - name: campaign_name
        description: "Name of the paid advertising campaign."
        tests:
          - not_null

      - name: channel
        description: "Marketing channel associated with the campaign."

      - name: utm_source
        description: "UTM source identifying the platform that generated the traffic."

      - name: utm_medium
        description: "UTM medium identifying the marketing channel type."

      - name: utm_campaign
        description: "UTM campaign value associated with the advertising campaign."

      - name: impressions
        description: "Number of times the campaign advertisement was displayed."

      - name: clicks
        description: "Number of clicks generated by the campaign."

      - name: ad_spend
        description: "Advertising spend for the campaign on the campaign date."

  - name: stg_crm_pipeline
    description: >
      Cleaned CRM pipeline data with standardized timestamp, date and monetary
      fields. Each row represents a lead and its associated company,
      opportunity and trial information where available.

    columns:
      - name: lead_id
        description: "Unique identifier of the lead."
        tests:
          - not_null
          - unique

      - name: lead_created_at
        description: "Timestamp when the lead entered the CRM."
        tests:
          - not_null

      - name: email_domain
        description: "Email domain associated with the lead."

      - name: company_id
        description: "Identifier of the company associated with the lead."

      - name: company_name
        description: "Name of the company associated with the lead."

      - name: campaign_id
        description: "Identifier of the marketing campaign attributed to the lead."

      - name: lifecycle_stage
        description: "Current lifecycle stage of the lead."

      - name: opportunity_id
        description: >
          Identifier of the associated sales opportunity. This field is null
          for leads that have not generated an opportunity.

      - name: opportunity_created_at
        description: "Timestamp when the sales opportunity was created."

      - name: opportunity_amount
        description: "Monetary value of the sales opportunity."

      - name: opportunity_close_date
        description: "Date when the sales opportunity was closed."

      - name: close_status
        description: "Final status of the sales opportunity, such as Won or Lost."

      - name: trial_start_at
        description: "Timestamp when the company started a product trial."

      - name: trial_end_at
        description: "Timestamp when the company completed or ended the product trial."

  - name: stg_product_usage_events
    description: >
      Cleaned product usage event data with standardized timestamp and date
      fields. Each row represents one product event generated by a user.

    columns:
      - name: event_timestamp
        description: "Timestamp when the product usage event occurred."
        tests:
          - not_null

      - name: event_date
        description: "Date when the product usage event occurred."
        tests:
          - not_null

      - name: company_id
        description: "Identifier of the company associated with the event."
        tests:
          - not_null

      - name: user_id
        description: "Identifier of the user who generated the event."
        tests:
          - not_null

      - name: event_type
        description: "Type of product usage event."
        tests:
          - not_null

      - name: plan_tier
        description: "Subscription plan associated with the company or user."
        tests:
          - not_null

      - name: seats_used
        description: "Number of seats used at the time of the event."