version: 2

models:

  - name: mart_campaign_performance
    description: >
      Daily paid campaign performance combining advertising activity with
      eventual CRM outcomes for leads created on the same date and attributed
      to the same campaign. CRM outcomes are aligned using the lead creation
      date because the source data does not contain an explicit ad-click
      attribution timestamp.

    columns:

      - name: campaign_date
        description: "Date of the paid advertising activity."
        tests:
          - not_null

      - name: campaign_id
        description: "Identifier of the paid advertising campaign."
        tests:
          - not_null

      - name: campaign_name
        description: "Name of the paid advertising campaign."
        tests:
          - not_null

      - name: channel
        description: "Paid marketing channel associated with the campaign."

      - name: utm_source
        description: "UTM source identifying the platform that generated the traffic."

      - name: utm_medium
        description: "UTM medium identifying the marketing channel type."

      - name: utm_campaign
        description: "UTM campaign value associated with the advertising campaign."

      - name: impressions
        description: "Total number of ad impressions."

      - name: clicks
        description: "Total number of ad clicks."

      - name: total_ad_spend
        description: "Total advertising spend."

      - name: total_leads
        description: >
          Number of leads attributed to the campaign and created on the
          campaign date.

      - name: total_opportunities
        description: "Number of distinct opportunities generated by attributed leads."

      - name: won_opportunities
        description: "Number of distinct closed-won opportunities."

      - name: lost_opportunities
        description: "Number of distinct closed-lost opportunities."

      - name: total_pipeline_value
        description: "Total opportunity value generated by attributed leads."

      - name: total_won_revenue
        description: "Total revenue from closed-won opportunities."

      - name: average_won_deal_value
        description: "Average opportunity value of closed-won opportunities."

      - name: average_sales_cycle_days
        description: >
          Average number of days between opportunity creation and closure for
          closed-won opportunities. Records whose close date precedes the
          opportunity creation date are excluded.

      - name: click_through_rate
        description: "Ad clicks divided by ad impressions."

      - name: cost_per_click
        description: "Advertising spend divided by ad clicks."

      - name: cost_per_lead
        description: "Advertising spend divided by attributed leads."

      - name: customer_acquisition_cost
        description: >
          Advertising spend divided by closed-won opportunities from
          attributed leads.

      - name: paid_roas
        description: "Closed-won revenue divided by advertising spend."

      - name: lead_to_opportunity_rate
        description: "Distinct opportunities divided by attributed leads."

      - name: opportunity_win_rate
        description: "Closed-won opportunities divided by total opportunities."

  - name: mart_lead_cohort_progression
    description: >
      Monthly lead cohorts showing how leads progress into opportunities,
      product trials, completed trials and closed-won customers. Revenue and
      sales outcomes are assigned to the month in which the lead was created.

    columns:

      - name: lead_created_month
        description: "Month in which the lead entered the CRM."
        tests:
          - not_null
          - unique

      - name: total_leads
        description: "Number of distinct leads created during the month."

      - name: total_opportunities
        description: "Number of distinct opportunities generated by the lead cohort."

      - name: trials_started_companies
        description: >
          Number of distinct companies in the lead cohort with a populated
          trial start timestamp.

      - name: activated_trials_companies
        description: >
          Number of distinct companies in the lead cohort with a populated
          trial end timestamp, used as the available proxy for trial
          activation or completion.

      - name: total_customers
        description: >
          Number of customers represented by distinct closed-won
          opportunities in the lead cohort.

      - name: pipeline_value
        description: "Total opportunity value generated by the lead cohort."

      - name: won_revenue
        description: "Total revenue from closed-won opportunities in the lead cohort."

      - name: average_deal_size
        description: "Average opportunity value of closed-won opportunities."

      - name: average_sales_cycle_days
        description: >
          Average number of days between opportunity creation and closure for
          closed-won opportunities. Records whose close date precedes the
          opportunity creation date are excluded.

      - name: lead_to_opportunity_rate
        description: "Distinct opportunities divided by total leads."

      - name: opportunity_to_customer_rate
        description: "Closed-won opportunities divided by total opportunities."

      - name: trial_activation_rate
        description: >
          Companies with a populated trial end timestamp divided by companies
          with a populated trial start timestamp.

  - name: mart_product_adoption
    description: >
      Monthly product engagement metrics showing distinct active users and
      active companies overall and by plan tier. Overall monthly counts are
      calculated independently and should not be derived by summing plan-tier
      rows.

    columns:

      - name: event_month
        description: "Month in which the product usage activity occurred."
        tests:
          - not_null

      - name: aggregation_level
        description: >
          Indicates whether the row represents the overall monthly population
          or a monthly plan-tier breakdown.
        tests:
          - not_null

      - name: plan_tier
        description: >
          Subscription plan associated with the row. Overall rows use
          'all_plans'.
        tests:
          - not_null

      - name: active_users
        description: >
          Number of distinct users active during the month within the stated
          aggregation level. Overall rows count each user once per month,
          regardless of event frequency or plan tier.

      - name: active_companies
        description: >
          Number of distinct companies active during the month within the
          stated aggregation level. Overall rows count each company once per
          month, regardless of event frequency or plan tier.

 